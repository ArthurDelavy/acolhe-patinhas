spring.application.name=api

# Configurações da aplicação
api.security.token.secret=${JWT_SECRET}
app.tokenIssuer=acolhePatinhas
app.jwtTokenExpirationMs=600000
app.refreshTokenExpirationMs=1296000000
app.maxUserSessions=5
app.cors.allowedOrigins=${CORS_ORIGINS}

# Conexão Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

## Demais configurações do banco
spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Configuração global para transação de JSON 
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json


# Configuração do Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Provedor de Emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000